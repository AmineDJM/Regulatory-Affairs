# Render Blueprint — deploys the Next.js app (AMD Internal OS) + a managed
# PostgreSQL database.
#
# How to use:
#   1. In Render: New +  →  Blueprint  →  connect this GitHub repo.
#   2. IMPORTANT: select the branch  claude/hopeful-goodall-phd0nb
#   3. When prompted, set ADMIN_EMAIL and ADMIN_PASSWORD (your first login).
#   4. Apply. Render provisions Postgres, runs migrations, creates your admin,
#      builds and starts the app. No demo data — you fill it in.
#
# Notes:
#   - Free Postgres expires after ~30 days and the free web service sleeps after
#     inactivity (first hit ~50s). Upgrade the plans for always-on + durable DB.

databases:
  - name: amd-postgres
    plan: free
    databaseName: amd_internal_os

services:
  - type: web
    name: amd-internal-os
    runtime: node
    plan: free
    healthCheckPath: /login
    # Build installs deps, applies migrations, creates the Super Admin (idempotent),
    # then LINTS (phase séparée, bloquante) and builds Next.js. Lint et typecheck vivent
    # dans DEUX processus : additionnés dans le même heap ils dépassaient la limite Node
    # par défaut (~2 Go) → OOM pendant « Linting and checking validity of types ».
    # NODE_OPTIONS=4096 est un garde-fou ; le besoin mesuré est ≤ 1 Go (lint) et
    # ~1,4 Go (typecheck, dominé par les définitions Prisma).
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run db:bootstrap && npm run build:render
    startCommand: npx next start -p $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amd-postgres
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NODE_VERSION
        value: "20"
      # Limites d'upload par DÉFAUT (repli si la ligne de réglages est absente). Généreuses :
      # un ZIP de dossier entier passe. Réglables ensuite en Administration (base fait foi).
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: MAX_DRIVE_UPLOAD_MB
        value: "1024"
      # Your first login — set these in the Render dashboard when prompted.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # Notifications push (PWA) — collez les 2 clés VAPID générées (sinon push inerte).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
